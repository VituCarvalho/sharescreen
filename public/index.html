<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenCast - Compartilhar Tela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela inicial -->
  <div id="home-screen" class="screen active">
    <div class="container">
      <h1>ScreenCast</h1>
      <p class="subtitle">Compartilhe sua tela com audio pelo navegador</p>

      <div class="actions">
        <div class="quality-selector">
          <label>Qualidade</label>
          <div class="quality-options">
            <button class="quality-btn" data-quality="low">
              <span class="quality-label">Baixa</span>
              <span class="quality-detail">480p · 1 Mbps</span>
            </button>
            <button class="quality-btn active" data-quality="medium">
              <span class="quality-label">Media</span>
              <span class="quality-detail">720p · 2.5 Mbps</span>
            </button>
            <button class="quality-btn" data-quality="high">
              <span class="quality-label">Alta</span>
              <span class="quality-detail">1080p · 5 Mbps</span>
            </button>
            <button class="quality-btn" data-quality="ultra">
              <span class="quality-label">Ultra</span>
              <span class="quality-detail">4K · 12 Mbps</span>
            </button>
          </div>
          <div class="fps-selector">
            <label>FPS</label>
            <div class="fps-options">
              <button class="fps-btn active" data-fps="30">30</button>
              <button class="fps-btn" data-fps="60">60</button>
            </div>
          </div>
        </div>

        <button id="btn-share" class="btn btn-primary">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Compartilhar Minha Tela
        </button>

        <div class="divider"><span>ou</span></div>

        <div class="join-section">
          <input type="text" id="room-code" placeholder="Codigo da sala" maxlength="6" autocomplete="off">
          <button id="btn-join" class="btn btn-secondary">Assistir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tela do host -->
  <div id="host-screen" class="screen">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="status-dot live"></span>
        <span>Compartilhando</span>
        <span id="host-quality-badge" class="quality-badge"></span>
      </div>
      <div class="toolbar-center">
        <span class="room-code-display" id="host-room-code"></span>
        <button id="btn-copy-code" class="btn-icon" title="Copiar codigo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-right">
        <span id="viewer-count">0 assistindo</span>
        <button id="btn-stop" class="btn btn-danger btn-sm">Parar</button>
      </div>
    </div>
    <div class="video-container">
      <video id="local-video" autoplay muted playsinline></video>
    </div>
  </div>

  <!-- Tela do viewer -->
  <div id="viewer-screen" class="screen">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="status-dot watching"></span>
        <span>Assistindo</span>
      </div>
      <div class="toolbar-center">
        <span id="viewer-room-code" class="room-code-display"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-fullscreen" class="btn-icon" title="Tela cheia">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
          </svg>
        </button>
        <button id="btn-leave" class="btn btn-danger btn-sm">Sair</button>
      </div>
    </div>
    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <div id="viewer-status" class="viewer-status">Conectando...</div>
    </div>
    <div class="volume-control">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
      </svg>
      <input type="range" id="volume-slider" min="0" max="100" value="100">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
